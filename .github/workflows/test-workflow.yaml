name: First workflow

run-name: Automatic version and changelog updates
 
permissions:
  contents: write

on: 
  pull_request:
    branches: test-branch
    types: closed  



jobs:
  read-PR-desc:
    runs-on: ubuntu-latest
    env: 
      PR_desc: ${{github.event.pull_request.body}}
    steps:
      - name: "Print PR description"
        run: echo "This is the PR body - $PR_desc and this"

  update-version:
    runs-on: ubuntu-latest
    if: ${{github.event.pull_request.merged}}
    steps:
      - uses: actions/checkout@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4


      - name: "Set up user and configure git"
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"


      - name: "Bump version"
        run: | 
          npm version patch
          echo "NEW_VERSION=$(node -p \"require('./package.json').version\")" >> $GITHUB_ENV

      - name: "Get current date"
        run: echo "DATE=$(date +'%m/%d/%Y')" >> $GITHUB_ENV


      - name: "Update CHANGELOG"
        run: |
          $TARGET_LINE = 3


          awk -v n="$TARGET_LINE" -v entry="## Release $NEW_VERSION ($DATE)\n- ${{github.event.pull_request.title}}" '
          NR == n { print entry }
          { print }
          ' CHANGELOG.md > CHANGELOG.new.md

          mv CHANGELOG.new.md CHANGELOG.md

      - name: Push changes
        run: |
          git add .
          git commit -m "chore: Updated package.json version and changelog.md"
          git push --follow-tags
